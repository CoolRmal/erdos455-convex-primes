automation:
  methods:
  - method: agent
    models:
    - claude-opus-5-5
    framework: Claude Code
    tool_setup: |-
      One session, directed by the maintainer, designed and wrote the kernel-checkable certificate (the packed value iteration, its soundness proof and the elaboration-time generator) after benchmarking GMP-backed kernel reduction in the Lean kernel, nanoda and con-ron; it regenerated the source's potential with a C program (scripts/gen_phi.c) and cross-checked the packed algorithm with a Python reference (scripts/packed_ref.py), which reproduces the growth rates of the source for the moduli 15, 105, 1155, 15015 and 255255 (the last in a five-hour run). Two background agents in separate git worktrees formalized the constant G (Lemmas 14 and 15) and the analytic part (Lemmas 3-6 and 13, Corollary 12, Theorem 16 and Section 7) against fixed interface statements.
    cost:
      wall_time: about one day (2026-09-26 to 2026-09-27)
      spend_usd: subscription-based
      hardware: a laptop for Lean builds and benchmarks, API-only for inference
    prompting_notes: Human-directed; the maintainer supplied the draft and asked for a formalization of its main result that passes lake comparator and meets the Palomar standards.
  - method: manual
    models: []
    framework: n/a
    tool_setup: Human direction and judgement; the choice of the result and of the statements.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: local machine
    prompting_notes: n/a
  spend_usd: subscription-based; not separately tracked
  notes: |-
    The mathematics of the source and the Lean development were produced by AI under the maintainer's direction. No AI system is listed as an author.
fidelity:
  divergences: |-
    The runs are indexed by the least index n >= n_0 with gap(n) >= x for every x (not only for x >= d* as in the source), so that runs below d* are empty and need no special case. Theorem 16 is proved in the form N(D) <= (Lambda + G + eps) D / 2M + C_eps for every eps > 0 instead of with the error term log_2 D + C. Section 7 does not use gap(n) -> infinity. Lemma 15 is proved with the weaker (sufficient) precision 17.2244 < G < 17.2245. Proposition 11 is checked through an equivalent packed computation (with offsets, normalisation and a fieldwise maximum using guard bits) rather than through the source's checker, and the potential is recomputed at elaboration time rather than read from the source's file; it agrees with the source's potential up to an additive constant.
review:
  status: agent-reviewed
  reviewers:
  - the formalizing agents (Claude Code); no human review
  notes: |-
    No external review of the source or of the formalization. The Lean statements were checked against the source by reading Challenge.lean; the compared theorems use exactly propext, Classical.choice and Quot.sound, and lake comparator accepts them with the Lean kernel, nanoda and con-ron.
