status:
  scope: |-
    Formalized in full: Theorem 1 of the source in the sharp form liminf q_n / n^2 >= 255255 / (295318 + G) (Erdos455.ofReal_le_liminf), the numerical consequences liminf > 0.864289 (Erdos455.liminf_gt) and 0.864289 n^2 < q_n eventually (Erdos455.eventually_lt), the bound G < 17.2245 (Erdos455.G_lt), and Richter's bound 0.352 (Erdos455.erdos_455.variants.liminf). The quotient q_n / n^2 is taken in [0, infinity], as in Formal Conjectures. The certificate for the dynamic program (Proposition 11) is checked by the Lean kernel; no native_decide or other axiom is used.
    Not formalized: the exact value of the growth rate (only the upper bound 295318 is needed and checked), the tables of the source for smaller moduli, and the source's remarks on the limits of the method.
