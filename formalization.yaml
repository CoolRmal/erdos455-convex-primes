version: v0.4
project:
  name: 'Convex sequences of primes: liminf q_n / n^2 > 0.864289 (towards Erdős Problem #455)'
  description: |-
    Let q_0 < q_1 < q_2 < ... be primes whose gaps are non-decreasing, q(n+2) - q(n+1) >= q(n+1) - q(n). Erdős asked whether necessarily q_n / n^2 -> infinity (Erdős Problem #455); Richter (1976) proved liminf q_n / n^2 > 0.352.
    This development proves liminf q_n / n^2 >= M / (Lambda + G) > 0.864289, where M = 3·5·7·11·13·17 = 255255, Lambda = 295318 and G = 17.2244... is an explicit series over the primes >= 19 (with 17.2244 < G < 17.2245), together with the eventual form 0.864289 n^2 < q_n and, as a corollary, Richter's theorem in the exact form of erdos_455.variants.liminf in Formal Conjectures.
    A run of equal gaps d is an arithmetic progression of primes, which has at most P(d) - 2 terms after its first outside a sparse exceptional set (P(d) the least prime not dividing d); eventually all terms are coprime to M, which turns the counting of gaps into a max-plus dynamic program on the 92160 units of Z/MZ, periodic in the gap value. An integer potential on the units certifies that the program gains at most Lambda per period. This certificate, a computation of about 5·10^10 elementary operations, is checked by the Lean kernel without native_decide: the values of the program are packed into eight natural numbers (the unit classes modulo 15) with 17017 fields of 9 bits, so that each step of the value iteration is a few dozen GMP operations, whose soundness is proved once and for all; the period is checked in 499 kernel-evaluated chunks.
  authors:
  - Yongxi Lin
  license: Apache-2.0
  responsible_maintainers:
  - Yongxi Lin
